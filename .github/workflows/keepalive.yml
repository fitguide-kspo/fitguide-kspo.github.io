# Supabase 무료 프로젝트는 7일 동안 요청이 없으면 일시정지됩니다.
# 매주 월·목요일에 DB로 가벼운 요청을 한 번 보내 정지를 막습니다. (js/config.js 의 공개 키 사용)
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 0 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oE "supabaseUrl: *'[^']*'" js/config.js | sed -E "s/.*'([^']*)'/\1/")
          KEY=$(grep -oE "supabaseAnonKey: *'[^']*'" js/config.js | sed -E "s/.*'([^']*)'/\1/")
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase 설정이 비어 있어 건너뜁니다."; exit 0; fi
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "$URL/rest/v1/checkins?select=ck_date&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
